      <text x="65" y="130"
            font-family="Arial, sans-serif"
            font-size="25"
            font-weight="bold"
            fill="#ffffff">
        🌐 Portfolio Website
      </text>

      <text x="65" y="165"
            font-family="Arial, sans-serif"
            font-size="16"
            fill="#c9c9d6">
        Personal portfolio built with
      </text>

      <text x="65" y="192"
            font-family="Arial, sans-serif"
            font-size="16"
            fill="#ffffff">
        React • Next.js • Tailwind CSS
      </text>

      <text x="65" y="232"
            font-family="Arial, sans-serif"
            font-size="14"
            fill="#8A2BE2">
        View Repository →
      </text>
    </g>
  </a>

  <!-- Project 2 -->
  <a href="https://github.com/akbilalboss2007-collab/Bootstrap-website">
    <g filter="url(#shadow)">
      <rect x="520" y="90" width="440" height="175" rx="18" fill="url(#card)" stroke="#8A2BE2" stroke-width="2"/>

      <text x="545" y="130"
            font-family="Arial, sans-serif"
            font-size="25"
            font-weight="bold"
            fill="#ffffff">
        🎨 Bootstrap Website
