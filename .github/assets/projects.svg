  <!-- Project 3 -->
  <a href="https://github.com/akbilalboss2007-collab/storage-website">
    <g filter="url(#shadow)">
      <rect x="40" y="295" width="440" height="175" rx="18" fill="url(#card)" stroke="#8A2BE2" stroke-width="2"/>

